# Doctrine Encrypt Bundle
# https://github.com/nowo-tech/DoctrineEncryptBundle
# Generate secret key: php bin/console doctrine:encrypt:generate-secret-key
# Add .Halite.key, .Defuse.key and .<encryptor>.<alias>.key to .gitignore

nowo_doctrine_encrypt:
    default_profile: default
    # batch_size: 5   # optional; default batch for doctrine:decrypt:database and doctrine:encrypt:database (raw SQL)
    profiles:
        default:
            encryptor_class: Halite   # or Defuse (requires: composer require defuse/php-encryption ^2.1)
            secret_directory_path: '%kernel.project_dir%'
            # Optional: secret_key_filename: '.my_app.key'   # custom key file name (only when using path)
            # Optional: secret_key_env_var: '%env(APP_ENCRYPT_KEY)%'   # Symfony resolves at config load; do not set secret_directory_path; run generate-secret-key to get the key
    # Optional: add more profiles (e.g. personal_data, financial_data) - see docs/CONFIGURATION.md
