name: doctrine-encrypt-bundle-demo-symfony-7
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctrine-encrypt-demo-symfony7-php
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${PORT:-8007}:80"
    volumes:
      - .:/app
      # Mount bundle root so the demo uses bundle files from the repo
      - ../..:/var/doctrine-encrypt-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=dev
      - APP_DEBUG=1
      - APP_SECRET=${APP_SECRET:-demo-secret}
      - DATABASE_URL=sqlite:///%kernel.project_dir%/var/data.db
    networks:
      - doctrine-encrypt-demo-network

volumes:
  composer-cache:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
    driver: local

networks:
  doctrine-encrypt-demo-network:
    driver: bridge
