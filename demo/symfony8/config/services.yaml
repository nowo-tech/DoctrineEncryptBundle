services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'

  App\Repository\MysqlAesNoteRepository:
    arguments:
      $mysqlAesKey: '%env(MYSQL_AES_KEY)%'
